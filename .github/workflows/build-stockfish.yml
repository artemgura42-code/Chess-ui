
name: Build CHESS VISION with Stockfish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download CHESS VISION
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" --install "ndk;27.2.12479018"


      - name: Download Stockfish source
        run: |
          git clone --depth 1 https://github.com/official-stockfish/Stockfish.git

      - name: Build Stockfish for Android ARM64
        run: |
          export PATH="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          cd Stockfish/src

          echo "Downloading NNUE network..."
          make net

          echo "Building Android ARM64 Stockfish..."
          make -j2 build ARCH=armv8 COMP=ndk

          echo "Checking binary..."
          file stockfish

          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"

          cp stockfish "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libstockfish.so"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: |
          gradle :app:assembleDebug

      - name: Upload APK and Stockfish
        uses: actions/upload-artifact@v4
        with:
          name: CHESS-VISION-with-Stockfish
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/src/main/jniLibs/arm64-v8a/libstockfish.so
          if-no-files-found: error
